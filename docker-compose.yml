services:
  postgres:
    image: postgres:16-alpine
    container_name: newsera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsera
      POSTGRES_PASSWORD: newsera
      POSTGRES_DB: newsera
    ports:
      - "5433:5432" # 5433 en el host: evita conflicto con un PostgreSQL nativo en 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: . # raíz del repo: el backend necesita ../docs/abis
      dockerfile: backend/Dockerfile
    container_name: newsera-backend
    environment:
      DATABASE_URL: postgresql://newsera:newsera@postgres:5432/newsera
      PORT: "3001"
      RPC_URL_LOCAL: http://hardhat-node:8545
      PUBLICATION_REGISTRY_ADDRESS: ${PUBLICATION_REGISTRY_ADDRESS:-}
      VALIDATION_REGISTRY_ADDRESS: ${VALIDATION_REGISTRY_ADDRESS:-}
      REPUTATION_SYSTEM_ADDRESS: ${REPUTATION_SYSTEM_ADDRESS:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_started
      hardhat-node:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: . # raíz del repo: el frontend importa los ABIs de ../docs/abis
      dockerfile: frontend/Dockerfile
    container_name: newsera-frontend
    environment:
      VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-newsera-local-dev}
      VITE_PUBLICATION_REGISTRY_ADDRESS: ${PUBLICATION_REGISTRY_ADDRESS:-}
      VITE_VALIDATION_REGISTRY_ADDRESS: ${VALIDATION_REGISTRY_ADDRESS:-}
      VITE_REPUTATION_SYSTEM_ADDRESS: ${REPUTATION_SYSTEM_ADDRESS:-}
      VITE_BACKEND_URL: http://localhost:3001
      VITE_PINATA_JWT: ${VITE_PINATA_JWT:-}
    ports:
      - "5174:5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hardhat-node:
    build:
      context: ./blockchain
      dockerfile: Dockerfile.node
    container_name: newsera-hardhat
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const h=require('http');const r=h.request({hostname:'localhost',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},res=>{let d='';res.on('data',c=>d+=c);res.on('end',()=>process.exit(d.includes('result')?0:1))});r.write('{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"method\\\":\\\"eth_blockNumber\\\",\\\"params\\\":[],\\\"id\\\":1}');r.end()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
