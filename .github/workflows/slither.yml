name: Slither

on:
  push:
    branches: [main]
    paths: ["blockchain/contracts/**"]
  pull_request:
    paths: ["blockchain/contracts/**"]

jobs:
  slither:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: blockchain/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar contratos
        run: npx hardhat compile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Slither
        run: pip install slither-analyzer

      - name: Ejecutar Slither
        run: slither . --exclude-dependencies --fail-high
